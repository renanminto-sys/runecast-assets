<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Posicionar Arena - Runecast</title>
<style>
  body { margin:0; background:#0a0710; overflow:hidden; font-family:monospace; color:#9f7; }
  #c { display:block; width:100vw; height:100vh; }
  #panel { position:fixed; top:6px; left:6px; right:6px; background:rgba(0,0,0,0.8);
    padding:6px 8px; border-radius:8px; font-size:11px; z-index:10; max-height:46vh; overflow:auto; }
  .row { display:flex; align-items:center; gap:6px; margin:2px 0; }
  .row label { width:90px; flex-shrink:0; }
  .row input { flex:1; } .row span { width:46px; text-align:right; color:#fff; flex-shrink:0; }
  #vals { position:fixed; bottom:6px; left:6px; right:6px; background:rgba(0,40,0,0.85);
    padding:8px; border-radius:8px; font-size:11px; z-index:10; color:#cfffcf; white-space:pre-wrap; }
  #status { position:fixed; top:50%; left:0; right:0; text-align:center; color:#fc7; font-size:14px; z-index:5; padding:0 20px; }
  h4 { margin:5px 0 2px; color:#fc7; }
  #tg { position:fixed; bottom:96px; right:8px; z-index:11; background:#222; color:#9f7; border:1px solid #9f7; border-radius:6px; padding:6px 10px; font-family:monospace; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status">Carregando Three.js...</div>
<div id="panel">
  <h4>POSIÇÃO DA ARENA</h4>
  <div class="row"><label>mover X (lat)</label><input id="posX" type="range" min="-8" max="8" step="0.1" value="0"><span id="posXv">0</span></div>
  <div class="row"><label>mover Y (alt)</label><input id="posY" type="range" min="-4" max="4" step="0.1" value="0"><span id="posYv">0</span></div>
  <div class="row"><label>mover Z (prof)</label><input id="posZ" type="range" min="-10" max="6" step="0.1" value="0"><span id="posZv">0</span></div>
  <div class="row"><label>escala</label><input id="scale" type="range" min="1" max="14" step="0.1" value="6"><span id="scalev">6</span></div>
  <h4>CÂMERA</h4>
  <div class="row"><label>cam altura</label><input id="camY" type="range" min="3" max="14" step="0.5" value="10"><span id="camYv">10</span></div>
  <div class="row"><label>cam dist</label><input id="camZ" type="range" min="4" max="16" step="0.5" value="7"><span id="camZv">7</span></div>
  <div class="row"><label>FOV</label><input id="fov" type="range" min="25" max="60" step="1" value="38"><span id="fovv">38</span></div>
  <div class="row"><label>olhar Z</label><input id="lookZ" type="range" min="-6" max="2" step="0.5" value="-2"><span id="lookZv">-2</span></div>
</div>
<button id="tg">ocultar</button>
<div id="vals">Posicione/dimensione a arena ate ficar bonita na tela. Depois me mande estes valores.</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
window.THREE = THREE;
const statusEl = document.getElementById('status');
function showError(msg){ statusEl.innerHTML = msg; statusEl.style.color='#ff7777'; }
window.addEventListener('error', (e)=>{ showError('ERRO JS: '+e.message); });
statusEl.textContent = 'Three.js OK. Carregando arena...';
init();

function init(){
  const canvas=document.getElementById('c');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0b0814);
  scene.add(new THREE.AmbientLight(0x8877aa,1.0));
  const key=new THREE.DirectionalLight(0xfff2e0,1.4); key.position.set(5,12,6); scene.add(key);
  const fill=new THREE.DirectionalLight(0x88aaff,0.5); fill.position.set(-5,4,-3); scene.add(fill);

  // dois marcadores onde os magos ficariam (referência de escala/posição)
  function marker(color,x,z){ const g=new THREE.Group();
    const b=new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.22,0.7,10), new THREE.MeshStandardMaterial({color:color})); b.position.y=0.35; g.add(b);
    const h=new THREE.Mesh(new THREE.SphereGeometry(0.2,12,12), new THREE.MeshStandardMaterial({color:color})); h.position.y=0.85; g.add(h);
    g.position.set(x,0,z); scene.add(g); return g; }
  const m1=marker(0x33ddaa,-1.2,1.5), m2=marker(0xdd5533,1.2,-1.5);

  const els={};
  ['posX','posY','posZ','scale','camY','camZ','fov','lookZ'].forEach(id=>els[id]=document.getElementById(id));

  let camera;
  function makeCam(){ camera=new THREE.PerspectiveCamera(+els.fov.value, innerWidth/innerHeight, 0.1, 1000); updateCam(); }
  function updateCam(){ if(!camera)return; camera.fov=+els.fov.value; camera.aspect=innerWidth/innerHeight;
    camera.position.set(0,+els.camY.value,+els.camZ.value); camera.lookAt(0,0,+els.lookZ.value); camera.updateProjectionMatrix(); }
  makeCam();

  let arena=null, baseSize=null;
  {
    const loader=new GLTFLoader();
    loader.load('arena2_otimizada.glb',function(g){
      arena=g.scene;
      arena.updateMatrixWorld(true);
      const box=new THREE.Box3().setFromObject(arena);
      baseSize=new THREE.Vector3(); box.getSize(baseSize);
      const center=new THREE.Vector3(); box.getCenter(center);
      // centraliza no proprio pivot
      arena.position.x -= center.x; arena.position.z -= center.z; arena.position.y -= box.min.y;
      const wrap=new THREE.Group(); wrap.add(arena); scene.add(wrap);
      arena.userData.wrap=wrap;
      statusEl.style.display='none';
      apply();
    }, function(p){ statusEl.textContent='Carregando arena... '+(p.total?Math.round(p.loaded/p.total*100):'')+'%'; },
    function(err){ showError('ERRO ao carregar GLB:<br>'+(err && err.message ? err.message : err)); });
  }

  function apply(){
    if(arena){
      const wrap=arena.userData.wrap;
      const s=+els.scale.value/(baseSize.x||1);
      wrap.scale.setScalar(s);
      wrap.position.set(+els.posX.value, +els.posY.value, +els.posZ.value);
    }
    updateCam();
    document.getElementById('vals').textContent =
      'POSICAO ARENA:\n'+
      '  mover X: '+els.posX.value+'  Y: '+els.posY.value+'  Z: '+els.posZ.value+'\n'+
      '  escala (largura): '+els.scale.value+'\n'+
      'CAMERA: altura '+els.camY.value+', dist '+els.camZ.value+', FOV '+els.fov.value+', olhar Z '+els.lookZ.value+'\n'+
      '>> Me mande este bloco <<';
  }

  Object.values(els).forEach(function(el){ el.addEventListener('input',function(){
    document.getElementById(el.id+'v').textContent=el.value; apply();
  });});
  document.getElementById('tg').addEventListener('click',function(){var p=document.getElementById('panel');p.style.display=p.style.display==='none'?'block':'none';});
  addEventListener('resize',function(){makeCam();renderer.setSize(innerWidth,innerHeight);});

  function loop(){ requestAnimationFrame(loop); renderer.render(scene,camera); }
  loop();
}
</script>
</body>
</html>
